name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Serralheria-Paredes.Tests/Serralheria-Paredes.Tests.csproj

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Serralheria-Paredes.Tests/Serralheria-Paredes.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Validate migrations script
        run: dotnet ef migrations script --configuration Release --no-build --idempotent --output migration.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: migration.sql

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx