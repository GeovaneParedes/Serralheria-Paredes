# ==============================================================================
# Nginx Reverse Proxy - Serralheria-Paredes
# Stack: Cloudflare (SSL Full Strict / DNS / DDoS) -> Nginx -> Kestrel (.NET 10)
# ==============================================================================

# Rate limiting zone (Defesa contra brute-force / abuse)
limit_req_zone $binary_remote_addr zone=serralheria_limit:10m rate=30r/s;

# Upstream para o Kestrel rodando localmente
upstream kestrel_serralheria {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirecionamento HTTP -> HTTPS (gerenciado pelo Cloudflare ou Nginx)
server {
    listen 80;
    listen [::]:80;
    server_name serralheriaparedes.com.br www.serralheriaparedes.com.br;

    # Resposta direta para ACME / Certbot se necessário, senão redireciona
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS (Terminação SSL / Cloudflare Origin CA)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name serralheriaparedes.com.br www.serralheriaparedes.com.br;

    # Certificados SSL (Cloudflare Origin Certificate ou Let's Encrypt)
    ssl_certificate         /etc/ssl/certs/serralheria-origin.pem;
    ssl_certificate_key     /etc/ssl/private/serralheria-origin.key;

    # Protocolos e Ciphers Seguros (TLS 1.2 e 1.3)
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # Tamanho Máximo de Upload (ex: plantas, fotos de projetos, orçamentos)
    client_max_body_size 25M;

    # Otimização de Buffers e Timeouts
    client_body_buffer_size 128k;
    proxy_connect_timeout   60s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Regras de Log com IP Real vindo do Cloudflare
    # Mapeamento do IP Real do visitante via Cloudflare Header
    set $real_client_ip $remote_addr;
    if ($http_cf_connecting_ip) {
        set $real_client_ip $http_cf_connecting_ip;
    }

    access_log /var/log/nginx/serralheria_access.log combined;
    error_log  /var/log/nginx/serralheria_error.log warn;

    location / {
        limit_req zone=serralheria_limit burst=50 nodelay;

        proxy_pass http://kestrel_serralheria;
        proxy_http_version 1.1;

        # Preservação de Conexões Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Preservação do IP real e protocolo seguro repassados ao ASP.NET Core
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Repasse do cabeçalho nativo Cloudflare
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}
